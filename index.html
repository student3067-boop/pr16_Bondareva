<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquamarine</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="card-container">
    <!-- Шапка -->
    <header class="header">
      <div class="brand">
        <h1 class="logo">Aquamarine</h1>
        <p class="address">м.Одеса, Приморська 15</p>
      </div>
      <div class="work-time">11:00-23:00</div>
    </header>

    <div class="divider"></div>

    <!-- Заголовок -->
    <h2 class="main-title">Ваш куточок раю<br>на узбережжі</h2>

    <div class="divider"></div>

    <!-- Картинка из подпапки images -->
    <div class="image-wrapper">
      <img src="images/sea.jpg" alt="Вид на море" class="main-img">
    </div>

    <!-- Описание -->
    <div class="info-card">
      <p class="welcome-text">Ми ради вітати вас у Aquamarine!</p>
      <p class="sub-text">Відкрийте для себе найкращі страви з морепродуктів та затишну атмосферу.</p>
    </div>

    <div class="divider"></div>

    <!-- Верхние кнопки -->
    <div class="small-buttons-row">
      <button class="btn-sm">Мої бонуси</button>
      <button class="btn-sm">Зробити замовлення</button>
    </div>

    <!-- Нижняя группа (Меню и Забронировать) -->
    <div class="action-buttons-group">
      <div class="menu-row">
        <button class="btn-light btn-menu">Меню</button>
        <button class="btn-light btn-arrow">&rarr;</button>
      </div>
      <button class="btn-dark btn-book">Забронювати стіл</button>
    </div>
  </div>

</body>
</html>
